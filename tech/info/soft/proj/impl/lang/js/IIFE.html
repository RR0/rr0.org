<p><em>Immediately-Invoked Function Expression</em> : expression de fonction immédiatement invoquée.</p>
<section>
  <h2>Besoin</h2>
    <p>Exécuter automatiquement une fonction juste après sa déclaration.</p>
</section>
<section>
  <h2>Implémentation</h2>
    <h3>Javascript</h3>
    <p><pre><code>(function() {
  // Do something
})();</code></pre>
</section>
